name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  # schedule:
  #   - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build artifacts
    runs-on: ubuntu-latest
    env:
      GOOS: linux
      GOARCH: amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref || 'main' }}
          fetch-depth: 0

      - name: Fix git safe directory
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git status
          git rev-parse --show-toplevel

      - name: Resolve version tag
        id: version
        shell: bash
        run: |
          set -euo pipefail

          is_product_tag() {
            local tag="$1"
            local major
            [[ "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || return 1
            major="${BASH_REMATCH[1]}"
            (( major >= 1 ))
          }

          latest_product_tag() {
            git tag --list |
              grep -E '^v[1-9][0-9]*\.[0-9]+\.[0-9]+$' |
              sort -V |
              tail -n 1 || true
          }

          tag_exists() {
            git rev-parse -q --verify "refs/tags/$1" >/dev/null
          }

          create_release_tag() {
            release_tag="$1"
            if tag_exists "$release_tag"; then
              return
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$release_tag" -m "Release $release_tag"
            git push origin "refs/tags/$release_tag"
          }

          git fetch --force --tags origin

          geoip_week="$(date -u +%g%V)"
          week="${geoip_week:2:2}"
          if (( 10#$week < 1 || 10#$week > 53 )); then
            echo "Invalid GeoIP week: $geoip_week"
            exit 1
          fi

          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            version="${GITHUB_REF_NAME}"
            tag_source="pushed"
            if ! is_product_tag "$version"; then
              echo "Invalid tag: $version"
              echo "Expected SemVer vMAJOR.MINOR.PATCH with MAJOR >= 1 (starting v1.0.0)"
              exit 1
            fi
          else
            latest="$(latest_product_tag)"
            if [ -z "$latest" ]; then
              echo "No v1.x.x (or later) tag found."
              echo "Push v1.0.0 on main first; weekly GeoIP releases only bump patch."
              exit 1
            fi

            if [[ ! "$latest" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "Unparseable latest tag: $latest"
              exit 1
            fi
            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            patch="${BASH_REMATCH[3]}"
            patch=$((patch + 1))
            version="v${major}.${minor}.${patch}"
            while tag_exists "$version"; do
              patch=$((patch + 1))
              version="v${major}.${minor}.${patch}"
            done

            create_release_tag "$version"
            if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
              tag_source="manual"
            else
              tag_source="scheduled"
            fi
          fi

          if ! is_product_tag "$version"; then
            echo "Invalid resolved version: $version"
            exit 1
          fi
          [[ "$version" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          source_commit="$(git rev-parse HEAD)"

          {
            echo "VERSION_TAG=$version"
            echo "VERSION_MAJOR=v${major}"
            echo "VERSION_MINOR=v${major}.${minor}"
            echo "GEOIP_WEEK=$geoip_week"
            echo "TAG_SOURCE=$tag_source"
            echo "SOURCE_COMMIT=$source_commit"
          } >> "$GITHUB_ENV"

          {
            echo "version_tag=$version"
            echo "version_major=v${major}"
            echo "version_minor=v${major}.${minor}"
            echo "geoip_week=$geoip_week"
            echo "tag_source=$tag_source"
            echo "source_commit=$source_commit"
          } >> "$GITHUB_OUTPUT"

      - name: Fetch IPInfo GeoIP Database
        env:
          IPINFO_TOKEN: ${{ secrets.IPINFO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${IPINFO_TOKEN:-}"
          rm -f pkg/geoip/geoip.db
          wget -qO pkg/geoip/geoip.db "https://ipinfo.io/data/ipinfo_lite.mmdb?token=${IPINFO_TOKEN}"
          test -s pkg/geoip/geoip.db

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: pnpm

      - name: Build embedded Vue applications
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          pnpm generate:api
          pnpm typecheck
          pnpm test
          pnpm -r --filter './web/apps/**' build

      - name: Unit test
        run: go test ./...

      - name: Build
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: build --single-target --clean --skip=validate
        env:
          GORELEASER_CURRENT_TAG: ${{ steps.version.outputs.version_tag }}
          VERSION_TAG: ${{ steps.version.outputs.version_tag }}

      - name: Package artifacts
        run: |
          chmod -R +x ./dist/*/*
          mv ./dist/*/* ./dist
          test -x ./dist/dashboard-linux-amd64
          sha256sum ./dist/dashboard-linux-amd64 | awk '{print $1, "dashboard-linux-amd64"}' > ./dist/checksums.txt

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Set up image name
        id: image-name
        run: |
          GHCR_IMAGE_NAME=$(echo "ghcr.io/${{ github.repository_owner }}/santaizi-dashboard" | tr '[:upper:]' '[:lower:]')
          echo "GHCR_IMAGE_NAME=$GHCR_IMAGE_NAME" >> "$GITHUB_OUTPUT"

      - name: Build dashboard image and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version_tag }}
            org.opencontainers.image.revision=${{ steps.version.outputs.source_commit }}
            geoip.week=${{ steps.version.outputs.geoip_week }}
          tags: |
            ${{ steps.image-name.outputs.GHCR_IMAGE_NAME }}:latest
            ${{ steps.image-name.outputs.GHCR_IMAGE_NAME }}:${{ steps.version.outputs.version_major }}
            ${{ steps.image-name.outputs.GHCR_IMAGE_NAME }}:${{ steps.version.outputs.version_minor }}
            ${{ steps.image-name.outputs.GHCR_IMAGE_NAME }}:${{ steps.version.outputs.version_tag }}

      - name: GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.version.outputs.version_tag }}
          commit: ${{ steps.version.outputs.source_commit }}
          name: ${{ steps.version.outputs.version_tag }}
          artifacts: "dist/dashboard-linux-amd64,dist/checksums.txt"
          generateReleaseNotes: true
          body: |
            - GeoIP week: ${{ steps.version.outputs.geoip_week }}
            - Image: `${{ steps.image-name.outputs.GHCR_IMAGE_NAME }}:${{ steps.version.outputs.version_tag }}`
            - Tag source: ${{ steps.version.outputs.tag_source }}

      - name: Release summary
        shell: bash
        run: |
          {
            echo "## santaizi-dashboard release"
            echo ""
            echo "- Version: ${VERSION_TAG}"
            echo "- Tag source: ${TAG_SOURCE}"
            echo "- GeoIP week: ${GEOIP_WEEK}"
            echo "- Image: ${{ steps.image-name.outputs.GHCR_IMAGE_NAME }}:${VERSION_TAG}"
            echo "- Channels: latest, ${VERSION_MAJOR}, ${VERSION_MINOR}"
          } >> "$GITHUB_STEP_SUMMARY"
